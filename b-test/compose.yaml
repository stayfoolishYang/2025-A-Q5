services:
  jammers:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:2026:2026"
      - "127.0.0.1:2027:2027"
    volumes:
      - jammers-data:/data
    secrets:
      - jammers_token
    stop_grace_period: 20s
secrets:
  jammers_token:
    file: ./secrets/token
volumes:
  jammers-data:
