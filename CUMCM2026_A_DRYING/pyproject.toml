[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm2026-a-drying"
version = "0.6.0"
description = "A26-04-v2 reproducible cylindrical drying solver"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "openpyxl>=3.0"]

[project.optional-dependencies]
test = ["pytest>=7", "sympy>=1.11"]

[project.scripts]
drying = "drying.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
